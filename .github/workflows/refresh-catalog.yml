# Re-scrapes db.ascension.gg and commits the catalog if anything changed.
#
# This half genuinely can run unattended: the scrape only needs the public
# database. Prices cannot -- they come from TSM SavedVariables on a machine that
# runs the game -- so this workflow deliberately leaves prices.json alone and
# lets the published price file supply them at runtime.
name: Refresh catalog

on:
  schedule:
    - cron: '17 4 * * 1'      # Mondays, 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache scraped pages
        uses: actions/cache@v4
        with:
          path: cache
          key: aowow-cache-${{ github.run_id }}
          restore-keys: aowow-cache-

      - run: pip install requests beautifulsoup4

      - name: Scrape the High Risk lists
        run: python highrisk.py --delay 0.5

      - name: Rebuild the catalog
        run: python build_data.py

      - name: Commit if the catalog changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/highrisk web/public/data.json
          if git diff --cached --quiet; then
            echo "Catalog unchanged."
          else
            git commit -m "Refresh catalog from db.ascension.gg"
            git push
          fi
